# Shiny Server configuration for the PCAGO server image (Dockerfile_server)

# Run applications as the unprivileged "shiny" user
run_as shiny;

# Reverse proxy compatibility (Apache in front of pcago.bioinf.uni-jena.de)
disable_protocols websocket xdr-streaming xhr-streaming iframe-eventsource iframe-htmlfile;

# PCAGO calculations can take a while; avoid premature disconnects
http_keepalive_timeout 1800;

server {
  listen 8000;
  app_init_timeout 1800;
  app_idle_timeout 1800;

  location / {
    app_dir /srv/pcago;
    log_dir /home/shiny/logs;
  }
}
